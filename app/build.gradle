plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.wavefly.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.wavefly.app"
        minSdk 27
        // targetSdk 28 de propósito: permite rodar o ffmpeg embutido e gravar em Download/WaveFly
        // (mesmo modelo do Termux). O app é instalado por APK, fora da Play Store.
        targetSdk 28
        versionCode 20
        versionName "1.7.2-teste"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    signingConfigs {
        debug {
            storeFile file("wavefly-debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

chaquopy {
    defaultConfig {
        version "3.11"
        buildPython "python3"
        pip {
            install "yt-dlp"
            install "mutagen"
            install "certifi"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Traz o ffmpeg pronto para Android (usado para converter para MP3 e juntar vídeo+áudio)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
