plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.wavefly.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.wavefly.nativo"
        minSdk 27
        // targetSdk 28 de propósito: permite rodar o ffmpeg embutido e gravar em Download/WaveFly
        // (mesmo modelo do Termux). O app é instalado por APK, fora da Play Store.
        targetSdk 28
        versionCode 70
        versionName "1.1.0-nativo-teste"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // A chave de assinatura é secreta: vem de variáveis de ambiente (segredos do GitHub), nunca do repositório.
    signingConfigs {
        release {
            def ks = System.getenv("WAVEFLY_KEYSTORE")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("WAVEFLY_KEYSTORE_PASSWORD")
                keyAlias "wavefly"
                keyPassword System.getenv("WAVEFLY_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.8'
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

chaquopy {
    defaultConfig {
        version "3.11"
        buildPython "python3"
        pip {
            install "yt-dlp"
            install "mutagen"
            install "certifi"
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation platform('androidx.compose:compose-bom:2024.02.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.8.2'
    // Traz o ffmpeg pronto para Android (usado para converter para MP3 e juntar vídeo+áudio)
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    implementation 'io.github.junkfood02.youtubedl-android:ffmpeg:0.18.1'
}
